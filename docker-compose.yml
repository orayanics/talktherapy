services:
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: talktherapy
      DB_USERNAME: talktherapy
      DB_PASSWORD: talktherapy
      PHONEME_SERVICE_URL: http://py:8001
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./server:/var/www/html
      - server_vendor:/var/www/html/vendor
      - server_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      py:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  client:
    build: ./client
    env_file: ./client/.env
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server
    restart: unless-stopped

  py:
    build: ./py
    env_file: ./py/.env
    ports:
      - "8001:8001"
    volumes:
      - py_models:/models
    restart: unless-stopped

  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: talktherapy
      POSTGRES_USER: talktherapy
      POSTGRES_PASSWORD: talktherapy
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talktherapy -d talktherapy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  client_node_modules:
  server_vendor:
  server_storage:
  py_models:
  postgres_data:
