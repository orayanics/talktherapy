[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "talktherapy-phoneme-service"
version = "0.1.0"
description = "Private phoneme analysis service for TalkTherapy"
requires-python = ">=3.11,<3.14"
dependencies = [
    "av==18.1.0",
    "fastapi==0.116.1",
    "faster-whisper==1.2.0",
    "phonemizer==3.3.0",
    "python-multipart==0.0.20",
    "PyYAML==6.0.2",
    "requests==2.34.2",
    "soundfile==0.13.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.setuptools.package-data]
phoneme_service = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
